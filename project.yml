name: AirStrum
options:
  bundleIdPrefix: com.yanfd
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  developmentLanguage: en
targets:
  AirStrum:
    type: application
    platform: iOS
    sources:
      - path: AirStrum
      - path: Shared
    resources:
      - path: Resources
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.yanfd.airstrum
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_KEY_CFBundleDisplayName: AirStrum
      SWIFT_VERSION: 5.0
    dependencies:
      - target: AirStrumWatch
        embed: true
  AirStrumWatch:
    type: application
    platform: watchOS
    sources:
      - path: AirStrumWatch
      - path: Shared
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.yanfd.airstrum.watchkitapp
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_KEY_CFBundleDisplayName: AirStrum Watch
      SWIFT_VERSION: 5.0
    info:
      path: AirStrumWatch/Info.plist
      properties:
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.yanfd.airstrum
        WKRunsIndependentlyOfCompanionApp: false
        NSMotionUsageDescription: AirStrum uses wrist motion to detect your strumming.
schemes:
  AirStrum:
    build:
      targets:
        AirStrum: all
    run:
      config: Debug
  AirStrumWatch:
    build:
      targets:
        AirStrumWatch: all
