name: AirStrum
options:
  bundleIdPrefix: com.yanfd
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  developmentLanguage: en
targets:
  AirStrum:
    type: application
    platform: iOS
    sources:
      - path: AirStrum
      - path: Shared
    resources:
      - path: Resources
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.yanfd.airstrum
      INFOPLIST_KEY_CFBundleDisplayName: AirStrum
      INFOPLIST_KEY_NSMicrophoneUsageDescription: AirStrum uses audio output to play your chord strums.
      SWIFT_VERSION: 5.0
    dependencies:
      - target: AirStrumWatch
        embed: true
  AirStrumWatch:
    type: application.watchapp2
    platform: watchOS
    sources:
      - path: AirStrumWatch
      - path: Shared
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.yanfd.airstrum.watchkitapp
      INFOPLIST_KEY_CFBundleDisplayName: AirStrum Watch
      SWIFT_VERSION: 5.0
      INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.yanfd.airstrum
      INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: YES
    info:
      path: AirStrumWatch/Info.plist
      properties:
        WKBackgroundModes:
          - audio
        NSMotionUsageDescription: AirStrum uses wrist motion to detect your strumming.
